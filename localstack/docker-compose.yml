# LocalStack para el entorno dev.
#   docker compose -f localstack/docker-compose.yml up -d
#
# 4.4: la 4.0.x devuelve mal los GSI de DynamoDB y Terraform ve
# cambios permanentes en las tablas.
# La edición Community no persiste datos: si se recrea el contenedor,
# borra environments/dev/terraform.tfstate y vuelve a hacer apply.
services:
  localstack:
    image: localstack/localstack:4.4
    container_name: foodstore-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,events,sqs,ses,s3,iam,sts,lambda,logs,cloudwatch
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
