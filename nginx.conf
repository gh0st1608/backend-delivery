events {}

http {

  upstream auth_service {
    server auth:3000;
  }

  upstream shop_service {
    server shop:3002;
  }

  upstream checkout_service {
    server checkout:3003;
  }

  upstream order_service {
    server order:3004;
  }

  upstream payment_service {
    server payment:3005;
  }

  upstream courier_service {
    server order:3004;
  }

  server {
    listen 80;

    location /auth/ {
      proxy_pass http://auth_service;
    }

    location /shop/ {
      proxy_pass http://shop_service;
    }

    location /checkout/ {
      proxy_pass http://checkout_service;
    }

    location /order/ {
      proxy_pass http://order_service;
    }

    location /payment/ {
      proxy_pass http://payment_service;
    }

    location /courier/ {
      proxy_pass http://courier_service;
    }

    # websocket tracking
    location /ws/ {
      proxy_pass http://order_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}