openapi: 3.0.3
info:
  version: 1.0.0
  title: API de Negocio Foodstore
  description: |
    API de negocio Foodstore, donde se define los alcances recursos.
      Recuros:

        - Product
        - 
  contact:
    name: Erick Galindo Aguilar
    email: erickmga123@gmail.com
    url: 'https://storage.googleapis.com/foodstore-design-dev/foodstore-dev.html'
    x-role: API Designer
  x-catalog:
    x-id-proxy: api-ne-foodstore
    x-id-product: internal-product-dev-foodstore
    x-id-catalog: api-ne-foodstore
servers:
  - url: 'https://api-dev.cuidaco.pe/api-ne-foodstore/v1'
    description: Servidor de ambiente Desarrollo
tags:
  - name: Products
    description: |
      Agrupa los servicios de gestión sobre el recurso de: Producto
  - name: Orders
    description: |
      Agrupa los servicios de gestión sobre el recurso de: Orden
  - name: Payments
    description: |
      Agrupa los servicios de gestión sobre el recurso de: Pago
  - name: Auths
    description: |
      Agrupa los servicios de gestión sobre el recurso de: Auth
paths:
  /products/register:
    parameters:
      - $ref: '#/components/parameters/Channel'
      - $ref: '#/components/parameters/ApiKey'
    post:
      summary: Create Product
      operationId: createProduct
      description: "\U0001F4E6 Procesos: Creación de producto con identificador único\n\n\U0001F527 Funcionalidad: Crear datos de producto\n\n  \n\U0001F680 Objetivo: Crear producto\n\n\U0001F4CC Comentarios: \n"
      tags:
        - Products
      requestBody:
        $ref: '#/components/requestBodies/CreateProductReq'
      responses:
        '200':
          $ref: '#/components/responses/CreateProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '407':
          $ref: '#/components/responses/ProxyAuthenticationResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '411':
          $ref: '#/components/responses/LengthRequiredResponse'
        '414':
          $ref: '#/components/responses/UriTooLongResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      security:
        - api_key: []
  /orders/register:
    parameters:
      - $ref: '#/components/parameters/Channel'
      - $ref: '#/components/parameters/ApiKey'
    post:
      summary: Create Order
      operationId: createOrder
      description: "\U0001F4E6 Procesos: Creación de orden con identificador único\n\n\U0001F527 Funcionalidad: Crear datos de orden\n\n  \n\U0001F680 Objetivo: Crear orden\n\n\U0001F4CC Comentarios: \n"
      tags:
        - Orders
      requestBody:
        $ref: '#/components/requestBodies/CreateOrderReq'
      responses:
        '200':
          $ref: '#/components/responses/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '407':
          $ref: '#/components/responses/ProxyAuthenticationResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '411':
          $ref: '#/components/responses/LengthRequiredResponse'
        '414':
          $ref: '#/components/responses/UriTooLongResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      security:
        - api_key: []
  /payments/register:
    parameters:
      - $ref: '#/components/parameters/Channel'
      - $ref: '#/components/parameters/ApiKey'
    post:
      summary: Create Payment
      operationId: createPayment
      description: "\U0001F4E6 Procesos: Creación de pago con identificador único\n\n\U0001F527 Funcionalidad: Crear datos de pago\n\n  \n\U0001F680 Objetivo: Crear pago\n\n\U0001F4CC Comentarios: \n"
      tags:
        - Payments
      requestBody:
        $ref: '#/components/requestBodies/CreatePaymentReq'
      responses:
        '200':
          $ref: '#/components/responses/CreatePaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '407':
          $ref: '#/components/responses/ProxyAuthenticationResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '411':
          $ref: '#/components/responses/LengthRequiredResponse'
        '414':
          $ref: '#/components/responses/UriTooLongResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      security:
        - api_key: []
  '/products/{id}':
    parameters:
      - $ref: '#/components/parameters/Channel'
      - $ref: '#/components/parameters/ApiKey'
      - name: id
        in: path
        description: identificador unico del recurso Product Fhir
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          example: 13eddde5-40f7-4d6d-a007-18c696e9fd56
    delete:
      summary: Delete Product
      operationId: deleteProduct
      description: "\U0001F4E6 Procesos: Eliminar producto con identificador\n\n\U0001F527 Funcionalidad: Eliminar datos del producto\n\n  \n\U0001F680 Objetivo: Eliminar producto\n\n\U0001F4CC Comentarios: \n"
      tags:
        - Products
      responses:
        '200':
          $ref: '#/components/responses/DeleteProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '407':
          $ref: '#/components/responses/ProxyAuthenticationResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '411':
          $ref: '#/components/responses/LengthRequiredResponse'
        '414':
          $ref: '#/components/responses/UriTooLongResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      security:
        - api_key: []
    get:
      summary: Get Product
      operationId: getProduct
      description: "\U0001F4E6 Procesos: Obtener el producto con identificador\n\n\U0001F527 Funcionalidad: Obtener datos de la producto\n\n  \n\U0001F680 Objetivo: Obtener producto\n\n\U0001F4CC Comentarios: \n"
      tags:
        - Products
      responses:
        '200':
          $ref: '#/components/responses/GetProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '407':
          $ref: '#/components/responses/ProxyAuthenticationResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '411':
          $ref: '#/components/responses/LengthRequiredResponse'
        '414':
          $ref: '#/components/responses/UriTooLongResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      security:
        - api_key: []
    put:
      summary: Update Product
      operationId: updateProduct
      description: "\U0001F4E6 Procesos: Actualizar producto con identificador\n\n\U0001F527 Funcionalidad: Actualizar datos del producto\n\n  \n\U0001F680 Objetivo: Actualizar producto\n\n\U0001F4CC Comentarios: \n"
      tags:
        - Products
      requestBody:
        $ref: '#/components/requestBodies/UpdateProductReq'
      responses:
        '200':
          $ref: '#/components/responses/UpdateProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '407':
          $ref: '#/components/responses/ProxyAuthenticationResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '411':
          $ref: '#/components/responses/LengthRequiredResponse'
        '414':
          $ref: '#/components/responses/UriTooLongResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      security:
        - api_key: []
  /auths/login:
    parameters:
      - $ref: '#/components/parameters/Channel'
      - $ref: '#/components/parameters/ApiKey'
    post:
      summary: Login
      operationId: Login
      description: "\U0001F4E6 Procesos: Login de usuario con credenciales\n\n\U0001F527 Funcionalidad: Login de usuario\n\n  \n\U0001F680 Objetivo: Permitir acceder al sistema al usuario\n\n\U0001F4CC Comentarios: \n"
      tags:
        - Auths
      requestBody:
        $ref: '#/components/requestBodies/LoginAuthReq'
      responses:
        '200':
          $ref: '#/components/responses/LoginAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '407':
          $ref: '#/components/responses/ProxyAuthenticationResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '411':
          $ref: '#/components/responses/LengthRequiredResponse'
        '414':
          $ref: '#/components/responses/UriTooLongResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedErrorResponse'
      security:
        - api_key: []
components:
  securitySchemes:
    api_key:
      description: Código único del Cliente.
      type: apiKey
      name: x-api-key
      in: header
  parameters:
    Channel:
      name: channel
      in: header
      description: Canal de la aplicación.
      required: true
      schema:
        type: string
        enum:
          - APP
          - WEB
          - OIT
        minLength: 3
        maxLength: 20
        example: WEB
    ApiKey:
      name: x-api-key
      in: header
      description: Código único del Cliente.
      required: true
      schema:
        type: string
        minLength: 10
        maxLength: 40
        example: 125THE7YFR510TD2756
  schemas:
    status:
      type: boolean
      description: |
        Tipo de status del producto
      example: true
      enum:
        - true
        - false
    business:
      type: string
      enum:
        - JOYERIA
        - RESTAURANT
      description: |
        Lista de códigos de tipo de comidas permitidas.
      example: RESTAURANT
    type:
      type: string
      enum:
        - CARTA
        - DESAYUNO
        - FONDO
        - MERIENDA
        - CENA
      description: |
        Lista de códigos de tipo de comidas permitidas.
      example: ARROCES
    name:
      type: object
      description: |
        Selección de platos según el tipo de comida
      oneOf:
        - title: ARROCES
          type: object
          properties:
            category:
              type: string
              enum:
                - ARROCES
            name:
              type: string
              enum:
                - ARROZ A LA JARDINERA
                - ARROZ CHAUFA
                - ARROZ CON POLLO
          required:
            - category
            - name
          example:
            category: ARROCES
            name: ARROZ CON POLLO
        - title: PASTAS
          type: object
          properties:
            category:
              type: string
              enum:
                - PASTAS
            name:
              type: string
              enum:
                - FIDEO EN SALSA BLANCA
                - TALLARIN ROJO
                - TALLARIN VERDE
          required:
            - category
            - name
          example:
            category: PASTAS
            name: FIDEO EN SALSA BLANCA
    price:
      type: number
      format: double
      description: |
        Precio del producto
      maximum: 999996
      minimum: 1
      example: 1099
    category:
      type: string
      enum:
        - ARROCES
        - CAUSAS
        - MARINOS
        - CRIOLLOS
        - PASTAS
      description: |
        Lista de códigos de tipo de comidas permitidas.
      example: ARROCES
    description:
      type: string
      description: |
        Nombre descriptivo del producto
      maxLength: 100
      example: Producto cubierto de adornos
    image:
      type: string
      description: |
        URL válida que representa el recurso
      maxLength: 2083
      example: 'https://www.ejemplo.com/recurso'
      pattern: '^https?:\/\/[^\s/$.?#].[^\s]*$'
    CreateProduct:
      type: object
      description: Entidad permite crear un producto
      properties:
        Data:
          type: object
          properties:
            Product:
              required:
                - status
                - business
                - type
                - name
                - price
                - category
                - description
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/status'
                business:
                  $ref: '#/components/schemas/business'
                type:
                  $ref: '#/components/schemas/type'
                name:
                  $ref: '#/components/schemas/name'
                price:
                  $ref: '#/components/schemas/price'
                category:
                  $ref: '#/components/schemas/category'
                description:
                  $ref: '#/components/schemas/description'
                image:
                  $ref: '#/components/schemas/image'
    StandardResponse:
      properties:
        Data:
          type: object
      required:
        - Data
    mongoId:
      type: string
      description: |
        Código unico del recurso producto
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
      example: 62977d46-7a50-41c9-8d84-38272ac2a8df
    code:
      type: number
      format: double
      description: |
        Mapeo interno de los códigos de sistemas
      maximum: 999996
      minimum: 1
      example: 1099
    message:
      type: string
      description: |
        Mensaje descriptivo de la solicitud
      maxLength: 100
      example: mensaje descriptivo de la solicitud
    CreateProductRes:
      type: object
      description: Devuelve un mensaje de un producto creado
      properties:
        Data:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/mongoId'
            statusCode:
              $ref: '#/components/schemas/code'
            message:
              $ref: '#/components/schemas/message'
          required:
            - id
            - statusCode
            - message
    StandardError:
      type: object
      properties:
        code:
          type: number
          format: double
          description: Código interno de error si se desea especificar
          example: '-'
        title:
          type: string
          description: >-
            Representa el código de estado HTTP obtenido del sistema proveedor,
            concatenado con su descripción.
          example: Descripción del error
        status:
          type: integer
          description: Código http de la respuesta
          example: 200
        dateTime:
          type: string
          description: >-
            Representa la fecha y hora del error presentado, se usa el formato
            YYYY-MM-DDTHH:mm:SSZ
          example: '2024-08-12T16:34:22'
        message:
          type: array
          description: Array de errores
          items:
            type: string
            example: >-
              Petición ejecutada satisfactoriamente, start javaw -jar
              project-1.0-SNAPSHOT.jar
      required:
        - code
        - title
        - message
        - status
        - dateTime
    StandardResponseError:
      properties:
        Error:
          $ref: '#/components/schemas/StandardError'
        Data:
          type: object
      required:
        - Error
        - Data
    stateOrder:
      type: string
      description: Estado del pedido
      enum:
        - pendiente
        - en_proceso
        - entregado
        - cancelado
      example: pendiente
    item:
      type: object
      properties:
        productId:
          type: string
          format: uuid
          description: ID del producto
        name:
          type: string
          description: Nombre del producto
        quantity:
          type: integer
          minimum: 1
          description: Cantidad solicitada del producto
        unitPrice:
          type: number
          format: float
          minimum: 0
          description: Precio unitario del producto
      required:
        - productId
        - name
        - quantity
        - unitPrice
    CreateOrder:
      type: object
      description: Entidad permite crear un pedido
      properties:
        Data:
          type: object
          properties:
            Order:
              type: object
              required:
                - userId
                - state
                - paymentId
                - totalAmount
                - items
              properties:
                userId:
                  $ref: '#/components/schemas/mongoId'
                state:
                  $ref: '#/components/schemas/stateOrder'
                paymentId:
                  $ref: '#/components/schemas/mongoId'
                totalAmount:
                  $ref: '#/components/schemas/price'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/item'
    CreateOrderRes:
      type: object
      description: Devuelve un mensaje de un orden creado
      properties:
        Data:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/mongoId'
            statusCode:
              $ref: '#/components/schemas/code'
            message:
              $ref: '#/components/schemas/message'
          required:
            - id
            - statusCode
            - message
    providerPayment:
      type: string
      description: Entidad del canal de pago final usado por el cliente
      enum:
        - yape
        - plin
        - visa
        - mastercard
        - efectivo
      example: yape
    statePayment:
      type: string
      description: Estado del pago
      enum:
        - pendiente
        - confirmado
        - fallido
        - reembolsado
      example: confirmado
    currency:
      type: string
      description: Moneda usada en el pago (código ISO 4217)
      enum:
        - PEN
        - USD
      example: PEN
    transactionId:
      type: string
      description: ID o código de la transacción generado por la pasarela
      example: PAYID-ABC123
    datePayment:
      type: string
      format: date-time
      description: Fecha y hora del pago registrado
      example: '2025-05-20T13:46:00Z'
    CreatePayment:
      type: object
      description: Entidad que permite registrar un pago realizado por un cliente
      properties:
        Data:
          type: object
          properties:
            Payment:
              type: object
              required:
                - orderId
                - provider
                - state
                - amountTotal
                - currency
                - datePayment
              properties:
                orderId:
                  $ref: '#/components/schemas/mongoId'
                provider:
                  $ref: '#/components/schemas/providerPayment'
                state:
                  $ref: '#/components/schemas/statePayment'
                amountTotal:
                  $ref: '#/components/schemas/price'
                currency:
                  $ref: '#/components/schemas/currency'
                transactionId:
                  $ref: '#/components/schemas/transactionId'
                datePayment:
                  $ref: '#/components/schemas/datePayment'
                description:
                  $ref: '#/components/schemas/message'
    CreatePaymentRes:
      type: object
      description: Devuelve un mensaje de un pago creado
      properties:
        Data:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/mongoId'
            statusCode:
              $ref: '#/components/schemas/code'
            message:
              $ref: '#/components/schemas/message'
          required:
            - id
            - statusCode
            - message
    GetProductRes:
      type: object
      description: Devuelve un item de producto
      properties:
        Data:
          type: object
          properties:
            Product:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/status'
                business:
                  $ref: '#/components/schemas/business'
                type:
                  $ref: '#/components/schemas/type'
                name:
                  $ref: '#/components/schemas/name'
                price:
                  $ref: '#/components/schemas/price'
                category:
                  $ref: '#/components/schemas/category'
                description:
                  $ref: '#/components/schemas/description'
                image:
                  $ref: '#/components/schemas/image'
    UpdateProduct:
      type: object
      description: Entidad permite actualizar un producto
      properties:
        Data:
          type: object
          properties:
            Product:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/status'
                business:
                  $ref: '#/components/schemas/business'
                type:
                  $ref: '#/components/schemas/type'
                name:
                  $ref: '#/components/schemas/name'
                price:
                  $ref: '#/components/schemas/price'
                category:
                  $ref: '#/components/schemas/category'
                description:
                  $ref: '#/components/schemas/description'
                image:
                  $ref: '#/components/schemas/image'
    UpdateProductRes:
      type: object
      description: Devuelve un mensaje de un producto actualizado
      properties:
        Data:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/mongoId'
            statusCode:
              $ref: '#/components/schemas/code'
            message:
              $ref: '#/components/schemas/message'
          required:
            - id
            - statusCode
            - message
    DeleteProductRes:
      type: object
      description: Devuelve un mensaje de un producto eliminado
      properties:
        Data:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/mongoId'
            statusCode:
              $ref: '#/components/schemas/code'
            message:
              $ref: '#/components/schemas/message'
          required:
            - id
            - statusCode
            - message
    typeAuth:
      type: string
      description: Tipo de autenticación
      enum:
        - password
        - oauth
    email:
      type: string
      format: email
      description: Correo del usuario (requerido si authType es password)
      example: usuario@ejemplo.com
    password:
      type: string
      format: password
      description: Contraseña (requerido si authType es password)
      example: S3guro123
    authPassword:
      type: object
      description: Autenticación usando usuario y contraseña.
      required:
        - authType
        - email
        - password
      properties:
        authType:
          $ref: '#/components/schemas/typeAuth'
        email:
          $ref: '#/components/schemas/email'
        password:
          $ref: '#/components/schemas/password'
        captchaToken:
          type: string
          description: 'Token de reCAPTCHA (opcional, si se requiere validación anti-bot)'
          example: 03AGdBq24...
    oauthProvider:
      type: string
      description: Proveedor externo usado para autenticación OAuth
      enum:
        - google
        - facebook
        - apple
        - github
      example: google
    authOAuth:
      type: object
      description: Autenticación usando proveedor OAuth.
      required:
        - authType
        - oauthProvider
        - oauthToken
      properties:
        authType:
          $ref: '#/components/schemas/typeAuth'
        oauthProvider:
          $ref: '#/components/schemas/oauthProvider'
        oauthToken:
          type: string
          description: Token OAuth del proveedor (requerido si authType es oauth)
          example: ya29.A0ARrdaM...
    LoginAuth:
      type: object
      description: Esquema para autenticar un usuario en el sistema
      properties:
        Data:
          type: object
          properties:
            Login:
              description: Tipos de autenticación soportados por el sistema.
              oneOf:
                - $ref: '#/components/schemas/authPassword'
                - $ref: '#/components/schemas/authOAuth'
              discriminator:
                propertyName: authType
                mapping:
                  password: '#/components/schemas/authPassword'
                  oauth: '#/components/schemas/authOAuth'
    LoginAuthRes:
      type: object
      description: Devuelve un mensaje de un autenticacion creado
      properties:
        Data:
          type: object
          properties:
            statusCode:
              $ref: '#/components/schemas/code'
            message:
              $ref: '#/components/schemas/message'
          required:
            - statusCode
            - message
